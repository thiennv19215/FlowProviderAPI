name: flowprovider-production

services:
  api:
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s

  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    pull_policy: always
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env.production}
    depends_on:
      api:
        condition: service_healthy
