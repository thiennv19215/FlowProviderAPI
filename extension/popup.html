<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app-container">
    <header class="header">
      <div class="brand">
        <div class="brand-badge">FP</div>
        <div class="brand-info">
          <span class="brand-name">Flow Provider</span>
          <span id="version" class="brand-ver">v1.0.8</span>
        </div>
      </div>
      <div id="status-badge" class="status-badge checking">
        <span class="status-dot"></span>
        <span id="status" class="status-text">Checking...</span>
      </div>
    </header>

    <section class="account-panel">
      <div class="account-info">
        <span class="account-icon">👤</span>
        <span id="account" class="account-text">Đang kiểm tra tài khoản...</span>
      </div>
      <div id="credits-pill" class="credits-pill" hidden>
        <span class="credits-icon">⚡</span>
        <span id="credits-value">0 credits</span>
      </div>
    </section>

    <section class="activity-panel">
      <div class="activity-header">
        <div class="activity-title-wrap">
          <span class="activity-title">Nhật ký hoạt động</span>
          <span id="job" class="job-tag idle">Idle</span>
        </div>
        <div class="activity-btns">
          <button id="copy-logs" class="btn-ghost" type="button" title="Sao chép nhật ký">Copy</button>
          <button id="clear-logs" class="btn-ghost" type="button" title="Xóa nhật ký">Clear</button>
        </div>
      </div>
      <div id="logs" class="logs-list">
        <div class="empty-state">Chưa có hoạt động nào</div>
      </div>
    </section>

    <footer class="footer">
      <button id="flow" class="btn-primary" type="button">Mở Google Flow</button>
      <div id="error" class="error-msg" hidden></div>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
