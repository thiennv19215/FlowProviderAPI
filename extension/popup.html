<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Flow Provider</h1>
    <div id="status" class="status">Checking...</div>
    <p id="account"></p>
    <label class="toggle-row" for="simulate">
      <span>
        <strong>Chế độ giả lập</strong>
        <small>Đánh dấu kết nối để backend xử lý phản hồi mock.</small>
      </span>
      <input id="simulate" type="checkbox" role="switch" aria-describedby="simulate-help">
    </label>
    <p id="simulate-help" class="simulation-note" hidden>Đang bật giả lập. Kết nối này sẽ được backend nhận diện là mock.</p>
    <section class="activity">
      <div class="activity-head">
        <span>Activity</span>
        <span id="job" class="job idle">Idle</span>
      </div>
      <div id="logs" class="logs"><div class="empty">No activity yet</div></div>
    </section>
    <button id="flow">Open Google Flow</button>
    <p id="error" class="error"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
