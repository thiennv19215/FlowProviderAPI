<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flow Provider Connector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="fp-console">
    <header class="fp-header">
      <div class="header-brand-group">
        <div class="fp-logo" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <div class="fp-title-wrap">
          <span class="fp-title">Flow Provider Connector</span>
          <span id="version" class="fp-badge-version">...</span>
        </div>
      </div>
      <div class="header-status-group">
        <div id="status-badge" class="fp-status-pill checking" title="Trạng thái kết nối Provider">
          <span class="status-dot"></span>
          <span id="status" class="status-label">Checking...</span>
        </div>
        <div class="fp-action-bar">
          <button id="flow" class="fp-icon-btn" type="button" title="Mở Google Flow">Flow</button>
          <button id="refresh" class="fp-icon-btn" type="button" title="Làm mới trạng thái">↻</button>
        </div>
      </div>
    </header>

    <main class="fp-stage">
      <section class="fp-panel">
        <div id="banner-alert" class="fp-alert-banner">
          <div class="alert-content">
            <span class="alert-icon">⚡</span>
            <span id="banner-text" class="alert-text">Đang kiểm tra kết nối Provider và Google Flow.</span>
          </div>
        </div>

        <div class="fp-card params-card">
          <div class="card-header">
            <div class="header-left-meta">
              <span class="meta-icon">◈</span>
              <span class="meta-heading">Connector Health</span>
            </div>
          </div>
          <div class="telemetry-grid">
            <div class="telemetry-card active">
              <span class="telemetry-value" id="stat-active">0</span>
              <span class="telemetry-tag">Đang xử lý</span>
            </div>
            <div class="telemetry-card completed">
              <span class="telemetry-value" id="stat-completed">0</span>
              <span class="telemetry-tag">Đã hoàn thành</span>
            </div>
            <div class="telemetry-card error">
              <span class="telemetry-value" id="stat-error">0</span>
              <span class="telemetry-tag">Lỗi cục bộ</span>
            </div>
          </div>
          <div class="subnav-job-state">
            <span class="job-dot"></span>
            <span id="job" class="job-tag idle">Idle</span>
          </div>
        </div>

        <section class="fp-activity-panel" id="activity-drawer">
          <div class="activity-topbar">
            <div class="activity-heading-wrap">
              <span class="activity-pulse"></span>
              <span class="activity-heading">Connector Activity</span>
            </div>
            <div class="activity-btn-group">
              <button id="copy-logs" class="fp-mini-btn" type="button">Copy</button>
              <button id="clear-logs" class="fp-mini-btn" type="button">Clear</button>
            </div>
          </div>
          <div id="logs" class="fp-log-stream">
            <div class="empty-state">Chưa có hoạt động.</div>
          </div>
        </section>
      </section>
    </main>

    <div id="error" class="fp-error-toast" hidden></div>

    <footer class="fp-footer">
      <div class="footer-account-meta">
        <span class="fp-account-avatar">●</span>
        <span id="account" class="fp-account-name">Đang kiểm tra tài khoản...</span>
        <div id="credits-pill" class="fp-credits-capsule" hidden>
          <span class="capsule-icon">⚡</span>
          <span id="credits-value">0 cr</span>
        </div>
      </div>
      <div class="footer-system-meta">
        <span class="system-info">Executor only · jobs are owned by FlowProviderAPI</span>
      </div>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
