name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e '.[dev]'
      - run: python -m compileall -q app
      - id: pytest
        continue-on-error: true
        run: python -m pytest -q --junitxml=pytest-results.xml
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
      - name: Fail if pytest failed
        if: steps.pytest.outcome == 'failure'
        run: exit 1
      - run: alembic upgrade head
        env:
          FLOW_PROVIDER_ENV: test
          FLOW_PROVIDER_DATABASE_URL: sqlite:///./.data/migration-test.db
          FLOW_PROVIDER_WORKER_ENABLED: "false"
          FLOW_PROVIDER_BOOTSTRAP_API_KEY: fpa_ci_key
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node --check extension/background.js
      - run: node --check extension/popup.js
      - run: node --test extension/tests/*.test.mjs
      - run: python -m json.tool extension/manifest.json >/dev/null
