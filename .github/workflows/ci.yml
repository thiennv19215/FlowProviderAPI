name: CI
on:
  pull_request:
  push:
    branches: [main, dev]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e '.[dev]'
      - run: python -m compileall -q app
      - run: python -m pytest -q
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node --check extension/background/background.js
      - run: node --check extension/popup/popup.js
      - run: node --test extension/tests/*.test.mjs
      - run: python -m json.tool extension/manifest.json >/dev/null
      - name: Package extension from tested source
        run: bash scripts/package-extension.sh
      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: flow-provider-extension
          path: dist/flow-provider-extension.zip
          if-no-files-found: error
          retention-days: 14
  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment shell scripts
        run: bash -n scripts/deploy-production.sh
      - name: Validate production Compose config
        run: |
          cp .env.production.example .env.production
          sed -i 's/^CLOUDFLARE_TUNNEL_TOKEN=$/CLOUDFLARE_TUNNEL_TOKEN=ci_tunnel_token/' .env.production
          sed -i 's/^FLOW_PROVIDER_BOOTSTRAP_API_KEY=$/FLOW_PROVIDER_BOOTSTRAP_API_KEY=fpa_prod_ci_business_secret/' .env.production
          sed -i 's/^FLOW_PROVIDER_EXTENSION_API_KEY=$/FLOW_PROVIDER_EXTENSION_API_KEY=fpe_prod_ci_connector_secret/' .env.production
          docker compose --env-file .env.production -f compose.production.yaml config >/dev/null
