services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowprovider
      POSTGRES_PASSWORD: flowprovider
      POSTGRES_DB: flowprovider
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowprovider"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - flowprovider_pg:/var/lib/postgresql/data

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - flowprovider_assets:/app/.data/assets

volumes:
  flowprovider_pg:
  flowprovider_assets:
